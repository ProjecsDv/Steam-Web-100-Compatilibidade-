<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Steam Web - V1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#171a21;color:#c7d5e0}
.top{background:#171a21;padding:0 20px;height:60px;display:flex;align-items:center;gap:25px;border-bottom:1px solid #2a3f5a}.top b{color:#fff;font-size:20px}
.login-btn{margin-left:auto;background:#5c7e10;color:#fff;border:none;padding:8px 14px;cursor:pointer;font-weight:bold}
.store{display:flex;padding:20px;gap:20px}.sidebar{width:240px;flex-shrink:0}.sidebar h4{color:#8f98a0;margin:15px 0 8px;font-size:12px}.sidebar div{padding:6px;color:#66c0f4;font-size:13px}
.sidebar select{width:100%;background:#1b2838;color:#c7d5e0;border:1px solid #2a3f5a;padding:6px}
.main{flex:1}.notice{background:#1b2838;border-left:4px solid #66c0f4;padding:12px;margin-bottom:15px;color:#fff;white-space:pre-line}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:15px}
.card{background:#2a3f5a;border-radius:4px;overflow:hidden;cursor:pointer}.card img{width:100%;height:135px;object-fit:cover}
.card h3{color:#fff;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-badge{font-size:10px;padding:3px 6px;border-radius:2px;font-weight:bold;margin-bottom:6px;display:inline-block}
.ac-green{background:#1a3328;color:#00ff88;border:1px solid #00ff8855}.ac-yellow{background:#332a1a;color:#ffcc00;border:1px solid #ffcc0055}.ac-red{background:#331a1a;color:#ff4444;border:1px solid #ff444455}
.card button{width:100%;background:linear-gradient(#75b022,#588a1b);color:#d2efa9;border:none;padding:8px;border-radius:2px;font-weight:bold;cursor:pointer;margin-top:6px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}
#player header{height:50px;background:#1b2838;display:flex;align-items:center;gap:10px;padding:0 15px}
#player canvas{flex:1;background:#0d1117}#gameFrame{flex:1;display:none}
#bootScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;overflow:hidden}
#bootScreen.hidden{display:none}.boot-header{height:60px;background:#171a21;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #00ff88;color:#fff;font-family:monospace;font-size:16px;flex-shrink:0;font-weight:bold}
.boot-grid{display:flex;flex:1;overflow:hidden}.boot-left{width:380px;background:#111a21;padding:0;border-right:2px solid #2a3f5a;display:flex;flex-direction:column}
.boot-left-top{padding:15px 15px 0 15px}.boot-left h3{color:#fff;font-size:13px;margin-bottom:10px}
.distro-opt{padding:10px 12px;background:#1b2838;margin-bottom:5px;border-radius:3px;cursor:pointer;border:1px solid transparent;color:#8f98a0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.distro-opt:hover{border-color:#66c0f4;color:#fff;background:#22364f}.distro-opt.active{border-color:#00ff88;background:#1a3328;color:#00ff88;font-weight:bold;box-shadow:0 0 8px #00ff8855}
.boot-center{flex:1;background:#0d1117;padding:20px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap}
.boot-log-ok{color:#00ff88}.boot-progress{position:absolute;bottom:40px;left:0;height:4px;background:#00ff88;transition:width 0.2s}
.boot-footer{height:40px;background:#1b2838;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:#8f98a0;font-family:monospace;flex-shrink:0}
.boot-bottom{padding:15px;background:#0f1922;border-top:2px solid #00ff88;flex-shrink:0}
#bootBtn{width:100%;background:linear-gradient(#7ed321,#5a9a14);color:#fff;border:none;padding:18px;font-weight:900;cursor:pointer;font-size:16px;border-radius:4px;box-shadow:0 0 15px #5a9a1488;animation:pulseBoot 1.8s infinite}
@keyframes pulseBoot{0%,100%{box-shadow:0 0 15px #5a9a1488}50%{box-shadow:0 0 30px #00ff88cc}}
.boot-selected-info{background:#1a3328;border:1px solid #00ff88;color:#00ff88;padding:10px 12px;border-radius:3px;font-family:monospace;font-size:12px;margin-bottom:12px;font-weight:bold;display:flex;justify-content:space-between}
.headphone-btn{background:#1b2838;border:1px solid #2a3f5a;color:#66c0f4;padding:6px 10px;cursor:pointer;font-size:11px;border-radius:3px}.headphone-btn.on{border-color:#00ff88;color:#00ff88;background:#1a3328}
.clique-word{color:#00ff88;text-decoration:underline;cursor:pointer;font-weight:900;background:#1a3328;padding:2px 8px;border-radius:3px;border:1px solid #00ff88;animation:cliquePulse 1s infinite}
@keyframes cliquePulse{0%,100%{box-shadow:0 0 5px #00ff88}50%{box-shadow:0 0 15px #00ff88}}
#bootDistroList.highlight{animation:listHighlight 0.6s 3}@keyframes listHighlight{0%{background:#111a21}50%{background:#1a3328}100%{background:#111a21}}
</style></head><body>
<div id="bootScreen"><div class="boot-header">🎮 STEAM WEB - SELECIONE O SISTEMA PARA DAR BOOT</div><div class="boot-grid"><div class="boot-left"><div class="boot-left-top"><div id="selectedInfo" class="boot-selected-info"><span>▶ Arch Linux</span><span>90% OK</span></div><h3>41 SISTEMAS - <span class="clique-word" onclick="focusSystems()">CLIQUE</span> PARA SELECIONAR</h3></div><div id="bootDistroList" style="flex:1;overflow-y:auto;padding:0 15px"></div><div class="boot-bottom"><button id="bootBtn" onclick="startSystemBoot()">► DAR BOOT AGORA - ARCH LINUX 90% [MELHOR]</button></div></div><div class="boot-center" id="bootLog"></div></div><div class="boot-footer"><span id="bootStatus">Arch Linux - 90% OK</span><span id="bootPercent">0%</span></div><div class="boot-progress" id="bootProgress" style="width:0%"></div></div>
<div class="top"><b>STEAM WEB</b><span style="color:#66c0f4" id="topDistro">ARCH LINUX</span><button class="login-btn" onclick="loginSteam()">ENTRAR COM STEAM</button></div>
<div class="store"><div class="sidebar"><h4>MEUS JOGOS</h4><div id="count">Carregando...</div><h4>TROCAR SISTEMA</h4><select id="distroSelect" onchange="updateBuild()"></select><div id="buildInfo" style="font-size:11px;color:#8f98a0;font-family:monospace;margin-top:6px"></div><h4>ANTI-CHEAT</h4><div id="acCheck" style="background:#111a21;padding:8px;border-radius:3px;border:1px solid #2a3f5a"></div><h4>FONE</h4><div style="background:#111a21;padding:8px;border-radius:3px;border:1px solid #2a3f5a;font-size:11px"><div id="sideHpStatus">🎧 OFF</div></div></div><div class="main"><div id="notice" class="notice"></div><h2 style="color:#fff" id="userTitle">Sua Biblioteca</h2><div class="games" id="games"></div></div></div>
<div id="player"><header><span id="gtitle" style="color:#fff;font-family:monospace;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px"></span><button id="hpBtn" class="headphone-btn" onclick="toggleHeadphone()">🎧 ATIVAR FONE</button><input id="vol" type="range" min="0" max="100" value="70" style="width:70px" oninput="setVolume(this.value)"><button onclick="closePlayer()" style="background:#c5c3c0;border:none;padding:6px 10px;cursor:pointer">X</button></header><canvas id="gameCanvas"></canvas><div id="gameFrame"></div></div>
<script>
let GAMES=[],keys={},audioCtx=null,masterGain=null,headphoneOn=false,currentVol=0.7;
function initAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=currentVol;masterGain.connect(audioCtx.destination);}
function toggleHeadphone(){initAudio();if(audioCtx.state==='suspended')audioCtx.resume();headphoneOn=!headphoneOn;const b=document.getElementById('hpBtn');const side=document.getElementById('sideHpStatus');if(headphoneOn){b.innerText='🎧 ON';b.classList.add('on');side.innerText='🎧 ON';playBootSound();}else{b.innerText='🎧 ATIVAR FONE';b.classList.remove('on');side.innerText='🎧 OFF';}}
function setVolume(v){currentVol=v/100;if(masterGain)masterGain.gain.value=currentVol;}
function playBootSound(){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.25*currentVol;o.connect(g);g.connect(masterGain);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);o.stop(audioCtx.currentTime+0.5);}
function playMoveBeep(){if(!headphoneOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=200+Math.random()*80;g.gain.value=0.06*currentVol;o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+0.06);}
function focusSystems(){const list=document.getElementById('bootDistroList');list.scrollTop=0;list.classList.remove('highlight');void list.offsetWidth;list.classList.add('highlight');document.getElementById('bootLog').innerText='[41 SISTEMAS]\nArch 90% [MELHOR] RTX 5060\nSteamOS 85%\nGentoo 87%\nUbuntu 80%\n\nCLIQUE NA LISTA A ESQUERDA';if(headphoneOn)playBootSound();setTimeout(()=>list.classList.remove('highlight'),1800);}
const GAMES_AC={2280:{ac:"None",chance:100},570:{ac:"VAC",chance:100},730:{ac:"VAC",chance:100},252490:{ac:"EAC",chance:5},1826330:{ac:"Vanguard",chance:0}};
function getACInfo(id){return GAMES_AC[id]||{ac:"None",chance:85};}
const BUILDS={0:{name:"SteamOS 3.5.17",kernel:"6.5.0-valve21-1",user:"deck@steamos",proton:"9.0-2",acBonus:10},1:{name:"Ubuntu 24.04 LTS",kernel:"6.8.0-31-generic",user:"user@ubuntu",proton:"9.0-2",acBonus:5},2:{name:"Debian 12",kernel:"6.1.0-20-amd64",user:"user@debian",proton:"8.0-5",acBonus:3},3:{name:"CentOS 7",kernel:"3.10.0-1160.el7",user:"root@centos",proton:"7.0-6",acBonus:-10},4:{name:"CentOS Stream 9",kernel:"5.14.0-480.el9",user:"root@stream",proton:"9.0-2",acBonus:0},5:{name:"RHEL 9.4",kernel:"5.14.0-427.el9",user:"root@rhel",proton:"9.0-2",acBonus:0},6:{name:"Gentoo 2024",kernel:"6.6.30-gentoo",user:"user@gentoo",proton:"GE-Proton9-7",acBonus:12},7:{name:"Fedora 40",kernel:"6.8.9-300.fc40",user:"user@fedora",proton:"9.0-2",acBonus:8},8:{name:"OpenSUSE Tumbleweed",kernel:"6.9.1-1-default",user:"user@opensuse",proton:"9.0-2",acBonus:6},9:{name:"Manjaro 24.0",kernel:"6.9.0-1-MANJARO",user:"user@manjaro",proton:"9.0-2",acBonus:7},10:{name:"Pop!_OS 22.04",kernel:"6.8.0-76060800-generic",user:"user@pop",proton:"9.0-2",acBonus:5},11:{name:"Zorin OS 17.1",kernel:"6.5.0-28-generic",user:"user@zorin",proton:"9.0-2",acBonus:4},12:{name:"Linux Mint 21.3",kernel:"5.15.0-107-generic",user:"user@mint",proton:"9.0-2",acBonus:5},13:{name:"Arch Linux",kernel:"6.9.3-arch1-1",user:"user@arch",proton:"Experimental",acBonus:15},14:{name:"EndeavourOS",kernel:"6.9.2-arch1-1",user:"user@endeavour",proton:"9.0-2",acBonus:10},15:{name:"Garuda Linux",kernel:"6.9.1-zen1-1-zen",user:"user@garuda",proton:"GE-Proton9-7",acBonus:11},16:{name:"Nobara 39",kernel:"6.8.9-200.nobara.fc39",user:"user@nobara",proton:"GE-Proton9-7",acBonus:13},17:{name:"Bazzite 3.5",kernel:"6.8.8-300.bazzite.fc40",user:"user@bazzite",proton:"9.0-2",acBonus:14},18:{name:"ChimeraOS 44",kernel:"6.8.7-chimeraos",user:"gamer@chimera",proton:"9.0-2",acBonus:14},19:{name:"HoloISO",kernel:"6.5.0-valve21-holo",user:"deck@holoiso",proton:"9.0-2",acBonus:10},20:{name:"Lakka 5.0",kernel:"6.6.30-lakka",user:"root@lakka",proton:"N/A",acBonus:-5},21:{name:"Batocera 38",kernel:"6.6.28",user:"root@batocera",proton:"N/A",acBonus:-5},22:{name:"Elementary OS 8",kernel:"6.8.0-31-generic",user:"user@elementary",proton:"9.0-2",acBonus:4},23:{name:"Deepin 23",kernel:"6.6.25-amd64-desktop-hwe",user:"user@deepin",proton:"9.0-2",acBonus:3},24:{name:"MX Linux 23.3",kernel:"6.1.0-20-amd64",user:"demo@mx",proton:"8.0-5",acBonus:3},25:{name:"Slackware 15.0",kernel:"6.6.21",user:"root@slackware",proton:"7.0-6",acBonus:-2},26:{name:"Void Linux",kernel:"6.8.10_1",user:"user@void",proton:"9.0-2",acBonus:6},27:{name:"Alpine 3.19",kernel:"6.6.22-0-lts",user:"root@alpine",proton:"8.0",acBonus:-8},28:{name:"Clear Linux",kernel:"6.8.9-1455.native",user:"clear@clr",proton:"9.0-2",acBonus:5},29:{name:"Solus 4.5",kernel:"6.8.9-293.current",user:"user@solus",proton:"9.0-2",acBonus:5},30:{name:"Kali 2024.1",kernel:"6.6.9-amd64",user:"kali@kali",proton:"9.0-2",acBonus:2},31:{name:"Parrot 6.0",kernel:"6.5.0-18-generic",user:"user@parrot",proton:"9.0-2",acBonus:2},32:{name:"Tails 6.1",kernel:"6.1.76",user:"amnesia@amnesia",proton:"N/A",acBonus:-10},33:{name:"Qubes OS 4.2",kernel:"6.6.21-1.qubes.fc37",user:"user@dom0",proton:"N/A",acBonus:-10},34:{name:"NixOS 24.05",kernel:"6.9.1",user:"user@nixos",proton:"9.0-2",acBonus:7},35:{name:"AlmaLinux 9.4",kernel:"5.14.0-427.el9",user:"root@alma",proton:"9.0-2",acBonus:0},36:{name:"Rocky Linux 9.4",kernel:"5.14.0-427.el9",user:"root@rocky",proton:"9.0-2",acBonus:0},37:{name:"Oracle Linux 9.4",kernel:"5.15.0-206.153.7.el9uek",user:"root@oracle",proton:"9.0-2",acBonus:0},38:{name:"SUSE Enterprise 15.5",kernel:"5.14.21-150500.55-default",user:"root@sles",proton:"8.0",acBonus:1},39:{name:"Amazon Linux 2023",kernel:"6.1.90-99.173.amzn2023",user:"ec2-user@amazon",proton:"8.0",acBonus:-5},40:{name:"Proxmox VE 8.2",kernel:"6.8.4-2-pve",user:"root@pve",proton:"9.0-2-VM",acBonus:0}};
let currentBuild=BUILDS[13],selectedBootId=13;
const sel=document.getElementById('distroSelect'),bootList=document.getElementById('bootDistroList');
Object.entries(BUILDS).forEach(([id,b])=>{const o=document.createElement('option');o.value=id;o.innerText=b.name;if(id==13)o.selected=true;sel.appendChild(o);const avg=75+b.acBonus;const d=document.createElement('div');d.className='distro-opt'+(id==13?' active':'');d.innerHTML=`<span>${b.name}</span><span style="font-size:10px;color:${avg>80?'#00ff88':'#ffcc00'}">${avg}% OK</span>`;d.onclick=()=>selectBootDistro(id);d.id='bd-'+id;bootList.appendChild(d);});
function selectBootDistro(id){selectedBootId=id;document.querySelectorAll('.distro-opt').forEach(e=>e.classList.remove('active'));document.getElementById('bd-'+id).classList.add('active');const b=BUILDS[id];document.getElementById('selectedInfo').innerHTML=`<span>▶ ${b.name}</span><span>${75+b.acBonus}% OK</span>`;document.getElementById('bootBtn').innerText=`► DAR BOOT AGORA - ${b.name.toUpperCase()} ${75+b.acBonus}%`;previewBoot(id);}
function previewBoot(id){const b=BUILDS[id];const avg=75+b.acBonus;document.getElementById('bootLog').innerText=`${b.name}\nKernel ${b.kernel} | Proton ${b.proton}\nVAC: ${100+b.acBonus}% | EAC: ${65+b.acBonus}%\nFAudio: ${headphoneOn?'ON':'OFF'}\n${avg}% OK`;document.getElementById('bootStatus').innerText=`${b.name} - ${avg}% OK`;document.getElementById('acCheck').innerHTML=`<div style="color:#00ff88">● ${avg}% OK</div>`;}
function getBootLines(b){return[`${b.name} - ${b.kernel}`,'Steam Web Bootloader','','[ OK ] Proton '+b.proton,'[ OK ] FAudio '+(headphoneOn?'ON':'OFF')];}
function startSystemBoot(){const b=BUILDS[selectedBootId];currentBuild=b;sel.value=selectedBootId;const logEl=document.getElementById('bootLog');const all=[...getBootLines(b),'',`${b.user}:~$ steam-ac-check`,`> Compat: ${75+b.acBonus}%`,`> VIVA A STEAM!`,''];logEl.innerHTML='';let i=0;document.getElementById('bootBtn').disabled=true;document.getElementById('bootBtn').innerText='BOOTANDO...';const interval=setInterval(()=>{if(i<all.length){const line=all[i];const div=document.createElement('div');div.className=line.startsWith('[ OK ]')?'boot-log-ok':'';div.innerText=line;logEl.appendChild(div);logEl.scrollTop=logEl.scrollHeight;const prog=(i/all.length)*100;document.getElementById('bootProgress').style.width=prog+'%';document.getElementById('bootPercent').innerText=Math.floor(prog)+'%';i++;}else{clearInterval(interval);document.getElementById('bootProgress').style.width='100%';document.getElementById('bootPercent').innerText='100%';loadLibrary();setTimeout(()=>{document.getElementById('bootScreen').classList.add('hidden');document.getElementById('topDistro').innerText=b.name.toUpperCase();},600);}},80);}
function updateBuild(){currentBuild=BUILDS[sel.value];document.getElementById('buildInfo').innerText=currentBuild.name+'\n'+currentBuild.kernel;}
updateBuild();previewBoot(13);
function runLinuxEmulator(c){
  const ac=getACInfo(c.appid);
  if(ac.chance<30){if(!confirm(`⚠️ ${c.name} - ${ac.chance}%\nAC: ${ac.ac}\nRodar?`))return;}
  initAudio();if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(c.url){ window.open(c.url,'_blank'); return; }
  const frame=document.getElementById('gameFrame'),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  canvas.width=1280;canvas.height=720;canvas.style.display='block';frame.style.display='none';frame.innerHTML='';
  const logs=[currentBuild.name,`Kernel ${currentBuild.kernel}`,`[ OK ] AC: ${ac.ac} ${ac.chance}%`,`[ OK ] FAudio: ${headphoneOn?'ON':'OFF'}`,`[ OK ] Proton ${currentBuild.proton}`,`${currentBuild.user}:~$ proton run "${c.name}"`];
  let p=0,idx=0,dLogs=[],x=640,y=360;
  function boot(){ p+=2; if(p>100)p=100; if(idx<logs.length){dLogs.push(logs[idx]);idx++;} ctx.fillStyle='#0d1117';ctx.fillRect(0,0,1280,720);ctx.font='14px monospace'; dLogs.forEach((l,i)=>{ctx.fillStyle=l.includes('AC:')?(ac.chance>70?'#00ff88':ac.chance>30?'#ffcc00':'#ff4444'):l.startsWith('[ OK')?'#00ff88':'#c7d5e0';ctx.fillText(l,30,40+i*20);}); if(p<100){ctx.fillStyle='#1b2838';ctx.fillRect(30,600,500,24);ctx.fillStyle='#66c0f4';ctx.fillRect(30,600,500*p/100,24);requestAnimationFrame(boot);}else{if(headphoneOn)playBootSound();loop();}}
  function loop(){ctx.fillStyle='#0d1117';ctx.fillRect(0,0,1280,720);let m=false;if(keys['w']||keys['arrowup']){y-=6;m=true;}if(keys['s']||keys['arrowdown']){y+=6;m=true;}if(keys['a']||keys['arrowleft']){x-=6;m=true;}if(keys['d']||keys['arrowright']){x+=6;m=true;}if(m)playMoveBeep();ctx.fillStyle='#66c0f4';ctx.fillRect(x-25,y-25,50,50);ctx.fillStyle='#000';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('🐧',x,y+5);ctx.textAlign='left';ctx.fillStyle=headphoneOn?'#00ff88':'#8f98a0';ctx.font='11px monospace';ctx.fillText(`${currentBuild.user}: ${c.name} | AC ${ac.ac} ${ac.chance}% | 60 FPS - WASD`,20,20);requestAnimationFrame(loop);}
  boot();
}
const FAKE_GAMES=[{appid:2280,name:"Doom (Proton WASM)",img:"https://cdn.cloudflare.steamstatic.com/steam/apps/2280/header.jpg",run:()=>runLinuxEmulator({name:"Doom",appid:2280,url:"https://dos.zone/doom/"})},{appid:730,name:"CS2 [VAC 100%]",img:"https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg",run:()=>runLinuxEmulator({name:"CS2",appid:730})}];
function loginSteam(){ alert("V2 - Login Steam real em breve. Por enquanto Demo Mode ativo 👏"); }
async function loadLibrary(){const params=new URLSearchParams(window.location.search);const steamid=params.get('steamid');const notice=document.getElementById('notice');if(!steamid){notice.innerText=`Demo Mode - ${currentBuild.name}\nVIVA A STEAM! - Steam em 1 aba`;GAMES=FAKE_GAMES;document.getElementById('count').innerText=`Demo (${FAKE_GAMES.length})`;render();return;}notice.innerText=`Steam Web OK - ${currentBuild.name}`;GAMES=FAKE_GAMES;render();}
function render(){document.getElementById('games').innerHTML=GAMES.map((g,i)=>{const ac=getACInfo(g.appid);return `<div class="card" onclick="play(${i})"><img src="${g.img}"><div style="padding:10px"><span class="ac-badge ${ac.chance>=70?'ac-green':'ac-yellow'}">${ac.ac} ${ac.chance}%</span><h3>${g.name}</h3><button>RODAR COM ${currentBuild.name.toUpperCase()}</button></div></div>`;}).join('');}
function play(i){const g=GAMES[i];document.getElementById('player').style.display='flex';document.getElementById('gtitle').innerText=`${currentBuild.user}:~$ proton run "${g.name}"`;g.run();}
function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('gameFrame').innerHTML='';}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key=='Escape')closePlayer();});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
</script></body></html>
