<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Steam Web - V2 API</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#171a21;color:#c7d5e0}
.top{background:#171a21;padding:0 20px;height:60px;display:flex;align-items:center;gap:25px;border-bottom:1px solid #2a3f5a}.top b{color:#fff;font-size:20px}
.login-btn{margin-left:auto;background:linear-gradient(#75b022,#588a1b);color:#fff;border:none;padding:8px 16px;cursor:pointer;font-weight:bold;border-radius:2px}
.store{display:flex;padding:20px;gap:20px}.sidebar{width:240px;flex-shrink:0}.sidebar h4{color:#8f98a0;margin:15px 0 8px;font-size:12px}.sidebar div{padding:6px;color:#66c0f4;font-size:13px}
.sidebar select{width:100%;background:#1b2838;color:#c7d5e0;border:1px solid #2a3f5a;padding:6px}
.main{flex:1}.notice{background:#1b2838;border-left:4px solid #66c0f4;padding:12px;margin-bottom:15px;color:#fff;white-space:pre-line}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:15px}
.card{background:#2a3f5a;border-radius:4px;overflow:hidden;cursor:pointer}.card img{width:100%;height:135px;object-fit:cover}
.card h3{color:#fff;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-badge{font-size:10px;padding:3px 6px;border-radius:2px;font-weight:bold;margin-bottom:6px;display:inline-block}
.ac-green{background:#1a3328;color:#00ff88;border:1px solid #00ff8855}.ac-yellow{background:#332a1a;color:#ffcc00;border:1px solid #ffcc0055}
.card button{width:100%;background:linear-gradient(#75b022,#588a1b);color:#d2efa9;border:none;padding:8px;border-radius:2px;font-weight:bold;cursor:pointer;margin-top:6px}
#player{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}
#player header{height:50px;background:#1b2838;display:flex;align-items:center;gap:10px;padding:0 15px}
#player canvas{flex:1;background:#0d1117}
#bootScreen{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;overflow:hidden}
#bootScreen.hidden{display:none}.boot-header{height:60px;background:#171a21;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #00ff88;color:#fff;font-family:monospace;font-size:16px;flex-shrink:0;font-weight:bold}
.boot-grid{display:flex;flex:1;overflow:hidden}.boot-left{width:380px;background:#111a21;padding:0;border-right:2px solid #2a3f5a;display:flex;flex-direction:column}
.boot-left-top{padding:15px 15px 0 15px}.boot-left h3{color:#fff;font-size:13px;margin-bottom:10px}
.distro-opt{padding:10px 12px;background:#1b2838;margin-bottom:5px;border-radius:3px;cursor:pointer;border:1px solid transparent;color:#8f98a0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.distro-opt.active{border-color:#00ff88;background:#1a3328;color:#00ff88;font-weight:bold}
.boot-center{flex:1;background:#0d1117;padding:20px;overflow-y:auto;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap}
.boot-log-ok{color:#00ff88}.boot-progress{position:absolute;bottom:40px;left:0;height:4px;background:#00ff88;transition:width 0.2s}
.boot-footer{height:40px;background:#1b2838;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:#8f98a0;font-family:monospace;flex-shrink:0}
.boot-bottom{padding:15px;background:#0f1922;border-top:2px solid #00ff88;flex-shrink:0}
#bootBtn{width:100%;background:linear-gradient(#7ed321,#5a9a14);color:#fff;border:none;padding:18px;font-weight:900;cursor:pointer;font-size:16px;border-radius:4px}
.clique-word{color:#00ff88;text-decoration:underline;cursor:pointer;font-weight:900;background:#1a3328;padding:2px 8px;border-radius:3px;border:1px solid #00ff88}
</style></head><body>
<div id="bootScreen"><div class="boot-header">🎮 STEAM WEB V2 - API OFICIAL</div><div class="boot-grid"><div class="boot-left"><div class="boot-left-top"><div id="selectedInfo" style="background:#1a3328;border:1px solid #00ff88;color:#00ff88;padding:10px;border-radius:3px;font-family:monospace;font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between"><span>▶ Arch Linux</span><span>90% OK</span></div><h3>41 SISTEMAS - SELECIONE</h3></div><div id="bootDistroList" style="flex:1;overflow-y:auto;padding:0 15px"></div><div class="boot-bottom"><button id="bootBtn" onclick="startSystemBoot()">► DAR BOOT AGORA - ARCH LINUX 90% [MELHOR]</button></div></div><div class="boot-center" id="bootLog"></div></div><div class="boot-footer"><span id="bootStatus">Arch Linux - 90% OK</span><span id="bootPercent">0%</span></div><div class="boot-progress" id="bootProgress" style="width:0%"></div></div>

<div class="top"><b>STEAM WEB</b><span style="color:#66c0f4" id="topDistro">ARCH LINUX</span><button class="login-btn" onclick="loginSteam()">ENTRAR COM STEAM</button></div>

<div class="store"><div class="sidebar"><h4>MEUS JOGOS</h4><div id="count">Demo</div><h4>SISTEMA</h4><select id="distroSelect"></select><div id="buildInfo" style="font-size:11px;color:#8f98a0;font-family:monospace;margin-top:6px"></div></div><div class="main"><div id="notice" class="notice">V2 - API Oficial Valve - Clique em ENTRAR COM STEAM e a Valve envia o código por e-mail</div><h2 style="color:#fff" id="userTitle">Sua Biblioteca</h2><div class="games" id="games"></div></div></div>

<div id="player"><header><span id="gtitle" style="color:#fff;font-family:monospace;flex:1;font-size:12px"></span><button onclick="closePlayer()" style="background:#c5c3c0;border:none;padding:6px 10px;cursor:pointer">X</button></header><canvas id="gameCanvas"></canvas></div>

<script>
// === V2 LOGIN OFICIAL - NAO COLETA SENHA ===
function loginSteam(){
  const returnUrl = encodeURIComponent(window.location.href.split('?')[0] + '?login=steam');
  const realm = encodeURIComponent(window.location.href.split('?')[0]);
  const openIdUrl = `https://steamcommunity.com/openid/login?openid.ns=http://specs.openid.net/auth/2.0&openid.mode=checkid_setup&openid.return_to=${returnUrl}&openid.realm=${realm}&openid.identity=http://specs.openid.net/auth/2.0/identifier_select&openid.claimed_id=http://specs.openid.net/auth/2.0/identifier_select`;
  window.location.href = openIdUrl;
}

const BUILDS={0:{name:"SteamOS 3.5.17",kernel:"6.5.0-valve21-1",user:"deck@steamos",proton:"9.0-2",acBonus:10},13:{name:"Arch Linux",kernel:"6.9.3-arch1-1",user:"user@arch",proton:"Experimental",acBonus:15}};
let currentBuild=BUILDS[13],selectedBootId=13;
const sel=document.getElementById('distroSelect'),bootList=document.getElementById('bootDistroList');
Object.entries(BUILDS).forEach(([id,b])=>{const o=document.createElement('option');o.value=id;o.innerText=b.name;if(id==13)o.selected=true;sel.appendChild(o);const d=document.createElement('div');d.className='distro-opt'+(id==13?' active':'');d.innerHTML=`<span>${b.name}</span><span>${75+b.acBonus}%</span>`;d.onclick=()=>{selectedBootId=id;document.querySelectorAll('.distro-opt').forEach(e=>e.classList.remove('active'));d.classList.add('active');document.getElementById('selectedInfo').innerHTML=`<span>▶ ${b.name}</span><span>${75+b.acBonus}%</span>`;document.getElementById('bootBtn').innerText=`► DAR BOOT - ${b.name.toUpperCase()}`;document.getElementById('bootLog').innerText=`${b.name}\nKernel ${b.kernel} | Proton ${b.proton}\n${75+b.acBonus}% OK`;};bootList.appendChild(d);});
function startSystemBoot(){const b=BUILDS[selectedBootId];currentBuild=b;sel.value=selectedBootId;const logEl=document.getElementById('bootLog');logEl.innerHTML='';const lines=[b.name+' - '+b.kernel,'[ OK ] Proton '+b.proton,'[ OK ] Steam API - OpenID Ready','','user@arch:~$ steam-web-v2','> API Oficial - Valve envia e-mail'];let i=0;const interval=setInterval(()=>{if(i<lines.length){const div=document.createElement('div');div.innerText=lines[i];if(lines[i].startsWith('[ OK'))div.className='boot-log-ok';logEl.appendChild(div);i++;document.getElementById('bootProgress').style.width=(i/lines.length*100)+'%';}else{clearInterval(interval);setTimeout(()=>{document.getElementById('bootScreen').classList.add('hidden');document.getElementById('topDistro').innerText=b.name.toUpperCase();loadLibrary();},400);}},80);}

const FAKE_GAMES=[{appid:2280,name:"Doom (Proton WASM)",img:"https://cdn.cloudflare.steamstatic.com/steam/apps/2280/header.jpg"},{appid:730,name:"CS2 [VAC 100%]",img:"https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg"}];
function loadLibrary(){
  const params=new URLSearchParams(window.location.search);
  const openId = params.get('openid.claimed_id');
  const notice=document.getElementById('notice');
  if(openId){
    const steamId = openId.split('/').pop();
    notice.innerText=`✅ Logado via API Oficial - SteamID: ${steamId}\nV2 conectada - Pronto pra V3 emulação na aba`;
    document.getElementById('count').innerText=`Biblioteca real - SteamID ${steamId} (adicione sua Steam Web API Key pra puxar jogos reais)`;
  } else {
    notice.innerText=`Demo Mode - ${currentBuild.name}\nClique em ENTRAR COM STEAM - Valve manda código por e-mail (sem coletar senha no seu site)`;
  }
  document.getElementById('games').innerHTML=FAKE_GAMES.map(g=>`<div class="card" onclick="alert('V3 - Emulação na aba em breve - ${g.name}')"><img src="${g.img}"><div style="padding:10px"><h3>${g.name}</h3><button>RODAR NA ABA - V3</button></div></div>`).join('');
}
function closePlayer(){document.getElementById('player').style.display='none';}
loadLibrary();
</script></body></html>
